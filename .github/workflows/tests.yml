name: Java build and smoke tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: mkdir -p out && javac -d out projects/lru-cache/LruCache.java projects/event-capacity/EventCapacity.java tests/SmokeTests.java && java -cp out SmokeTests
